name: local-kernel-ci

on:
  push:
    paths:
      - 'enginedge-local-kernel/**'
      - 'enginedge-local-kernel/.github/workflows/local-kernel-ci.yml'
  pull_request:
    paths:
      - 'enginedge-local-kernel/**'

jobs:
  python-ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install deps
        working-directory: enginedge-local-kernel
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt || true
          pip install black isort flake8 || true
      - name: Format check
        working-directory: enginedge-local-kernel
        run: |
          black --check . || (echo "Black formatting check failed. Run 'black .' to fix." && exit 1)
          isort --check-only --profile black . || (echo "isort check failed. Run 'isort . --profile black' to fix." && exit 1)
      - name: Lint check
        working-directory: enginedge-local-kernel
        run: |
          flake8 . --max-line-length=100 --extend-ignore=E203,W503 || (echo "Flake8 check failed. Fix linting errors." && exit 1)
      - name: Docker login
        if: github.ref == 'refs/heads/main'
        run: echo $CR_PAT | docker login ghcr.io -u $GITHUB_ACTOR --password-stdin
        env:
          CR_PAT: ${{ secrets.REGISTRY_TOKEN }}
      - name: Docker build & push
        if: github.ref == 'refs/heads/main'
        working-directory: enginedge-local-kernel
        run: |
          IMAGE=ghcr.io/${{ github.repository_owner }}/enginedge-local-kernel:${{ github.sha }}
          docker build -t $IMAGE .
          docker push $IMAGE
      - name: Helm deploy
        if: github.ref == 'refs/heads/main' && secrets.KUBECONFIG_B64 != ''
        env:
          KUBECONFIG_B64: ${{ secrets.KUBECONFIG_B64 }}
        run: |
          echo "$KUBECONFIG_B64" | base64 -d > kubeconfig
          export KUBECONFIG=$PWD/kubeconfig
          IMAGE=ghcr.io/${{ github.repository_owner }}/enginedge-local-kernel:${{ github.sha }}
          helm upgrade --install wolfram-kernel ../enginedge-core/platform/k8s/charts/worker-generic \
            --namespace default \
            --set image.repository=${IMAGE%:*} \
            --set image.tag=${IMAGE##*:} \
            --set component=wolfram-kernel \
            --set port=5000
